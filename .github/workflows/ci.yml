name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://asistente:asistente@localhost:5432/asistente
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: test-secret-key-for-ci-that-is-long-enough-32-chars
  LLM_API_KEY: ""
  EVOLUTION_API_KEY: ""
  WEBHOOK_SECRET: test-webhook-secret
  PLATFORM_TENANT_SLUG: plataforma
  PANEL_BASE_URL: http://localhost:5173

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: asistente
          POSTGRES_PASSWORD: asistente
          POSTGRES_DB: asistente
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U asistente -d asistente"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        working-directory: ./backend
        run: alembic upgrade head

      - name: Lint (ruff)
        working-directory: ./backend
        run: ruff check .

      - name: Tests (pytest)
        working-directory: ./backend
        run: pytest -x -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        working-directory: ./admin-web
        run: npm ci

      - name: Type check (tsc)
        working-directory: ./admin-web
        run: npx tsc --noEmit

      - name: Build (vite)
        working-directory: ./admin-web
        run: npm run build