services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asistente_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asistente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asistente}
      POSTGRES_DB: ${POSTGRES_DB:-asistente}
    ports:
      # Solo localhost: el 5432 del host lo ocupa el PostgreSQL local de Windows
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asistente} -d ${POSTGRES_DB:-asistente}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: asistente_redis
    ports:
      # Solo localhost: Redis sin contraseña no debe verse desde la red
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  evolution:
    # Versión fijada (no latest): builds reproducibles
    # 2.4.x exige licencia → última versión libre: v2.3.7 (incluye fixes @lid)
    image: evoapicloud/evolution-api:v2.3.7
    container_name: asistente_evolution
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Sin default: si no está en .env, compose no arranca (mejor fallar ruidoso)
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Define EVOLUTION_API_KEY en .env}
      SERVER_TYPE: http
      SERVER_PORT: 8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/2
      CACHE_REDIS_PREFIX_KEY: evolution
      LANGUAGE: es
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    ports:
      # Solo localhost: quien tenga la clave no debe poder leer chats desde la red
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  evolution_store:
