[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # migraciones autogeneradas (líneas largas, template)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI: Depends/Body/Query en defaults de endpoints es el patrón del framework
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# conftest: fija la policy del event loop de Windows ANTES de importar app/* (psycopg async)
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
